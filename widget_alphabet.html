<!DOCTYPE html>
<html lang="th" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jayda &amp; Dada Alphabet | ก-ฮ &amp; วาดชื่อหนูน้อย</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kids Studio">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./alphabet_core.css">
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <!-- PORTRAIT MODE HEADER -->
  <header>
    <div class="header-bar">
      <div style="display: flex; gap: 4px; flex-shrink: 0;">
        <a href="index.html" class="header-btn" style="text-decoration:none;" title="กลับหน้ารวมแอป (Home Portal)" data-title-th="กลับหน้ารวมแอป" data-title-en="Home Studio Hub">🏠</a>
        <a href="widget_numbers.html" class="header-btn" style="text-decoration:none;" title="ไปหน้านับเลข ๑-๑๐ (Numbers App)" data-title-th="ไปหน้านับเลข ๑-๑๐" data-title-en="Thai Numbers App">🔢</a>
      </div>
      <div class="app-title-badge notranslate" translate="no" data-i18n-th="🎨 ก-ฮ เจด้า &amp; ดาด้า" data-i18n-en="🎨 Jayda &amp; Dada Alphabet">🎨 ก-ฮ เจด้า &amp; ดาด้า</div>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-flag-btn active" data-set-lang="th" onclick="setUiLang('th')" title="ภาษาไทย">🇹🇭</button>
        <button type="button" class="lang-flag-btn" data-set-lang="en" onclick="setUiLang('en')" title="English">🇬🇧</button>
      </div>
      <button class="header-btn" onclick="toggleLandscapeManual()" title="สลับโหมดเขียนชื่อแนวนอน (Landscape Mode)" data-title-th="สลับโหมดเขียนชื่อแนวนอน" data-title-en="Sideways Name Studio">🔄</button>
      <button class="header-btn" id="momSettingsBtn" title="Mom's Settings (Hold 2s)">⚙️</button>
    </div>
  </header>

  <!-- PORTRAIT BOARD CARD -->
  <main class="board-card">
    <div class="stars-score">
      <span data-i18n-th="⭐ รวมดาวคนเก่ง:" data-i18n-en="⭐ Stars Earned:">⭐ รวมดาวคนเก่ง:</span>
      <span id="starCount">0</span>
    </div>

    <!-- Hero Card for Consonant -->
    <div class="consonant-hero">
      <div class="big-thai-char notranslate" id="heroChar" translate="no">ก</div>
      <div class="consonant-meta">
        <div class="mnemonic-th" id="heroMnemonicTh">ก เอ๋ย ก ไก่</div>
        <div class="mnemonic-en" id="heroMnemonicEn">Gor Gai (Chicken)</div>
      </div>
      <div class="hero-emoji" id="heroEmoji">🐔</div>

      <div class="hero-actions">
        <button class="sound-pulse-btn" onclick="speakCurrentConsonant()" title="ฟังเสียง" data-title-th="ฟังเสียง" data-title-en="Play Sound">🔊</button>
        <!-- Three Hands Holding Pens / Crayons (Zero Text) -->
        <button class="hands-practice-btn" onclick="openTraceModal()" title="วาดพยัญชนะ (Trace Letter)" data-title-th="วาดพยัญชนะ" data-title-en="Trace Letter">
          <span class="hand-icon">✍️</span>
          <span class="hand-icon">🖍️</span>
          <span class="hand-icon">✏️</span>
        </button>
      </div>
    </div>

    <!-- Navigation Arrows -->
    <div class="nav-row">
      <button class="nav-arrow-btn" onclick="prevConsonant()">❮</button>
      <div class="letter-counter" id="letterCounter">๑ / ๔๔</div>
      <button class="nav-arrow-btn" onclick="nextConsonant()">❯</button>
    </div>

    <!-- Alphabet Quick Drawer -->
    <div class="alphabet-grid-wrap">
      <div class="alphabet-pills" id="alphaPillsContainer"></div>
    </div>
  </main>

  <!-- TRACING MODAL (PORTRAIT) - DYNAMIC GLASS SCALING -->
  <div class="trace-modal" id="traceModal">
    <div class="trace-card">
      <div class="trace-header">
        <div class="trace-title" id="traceHeaderTitle">🎨 วาดลายเส้น ก ไก่</div>
        <button class="close-trace-btn" onclick="closeTraceModal()">✕</button>
      </div>

      <div class="canvas-container">
        <canvas id="traceCanvas" width="460" height="460"></canvas>
      </div>

      <div class="trace-actions">
        <button class="tool-btn" onclick="clearTraceCanvas()" data-i18n-th="🧽 ลบใหม่" data-i18n-en="🧽 Erase">🧽 ลบใหม่</button>
        <button class="tool-btn" onclick="speakTraceCoaching()" data-i18n-th="🔊 ฟังวิธีเขียน" data-i18n-en="🔊 Hear Guide">🔊 ฟังวิธีเขียน</button>
        <button class="tool-btn" onclick="nextConsonantFromModal()" data-i18n-th="ตัวต่อไป ❯" data-i18n-en="Next ❯">ตัวต่อไป ❯</button>
      </div>
    </div>
  </div>

  <!-- LANDSCAPE NAME STUDIO (TWO-PORTRAIT PICKER + FULL GLASS CANVAS) -->
  <div id="landscapeContainer" class="picker-mode">
    <!-- Two-Portrait Picker Screen -->
    <div class="portrait-picker-stage" id="portraitPickerStage">
      <button class="picker-close-btn" onclick="toggleLandscapeManual()" title="กลับหน้า ก-ฮ" aria-label="กลับหน้า ก-ฮ">✕</button>
      <button class="girl-portrait-btn jayda" onclick="selectGirl('jayda')" aria-label="เจด้า">
        <img src="./img/jayda.jpg" alt="เจด้า">
      </button>
      <button class="girl-portrait-btn dada" onclick="selectGirl('dada')" aria-label="ดาด้า">
        <img src="./img/dada.jpg" alt="ดาด้า">
      </button>
    </div>

    <!-- Multi-Letter Tracing Stage (Expanded Full Height + Floating Corner Buttons) -->
    <div class="name-canvas-stage" id="nameCanvasStage">
      <div class="landscape-canvas-box" id="nameCanvasBox">
        <button class="floating-canvas-btn floating-back-btn" onclick="resetNameStudio()" title="กลับไปเลือกรูปน้อง" aria-label="กลับไปเลือกรูปน้อง">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="kidBackGrad" x1="4" y1="6" x2="28" y2="26" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FF8FB1"/>
                <stop offset="100%" stop-color="#FF5E8E"/>
              </linearGradient>
            </defs>
            <path d="M14.5 7.5L5.5 16L14.5 24.5C15.6 25.5 17.4 24.8 17.4 23.2V19.2H24.5C26.2 19.2 27.5 17.9 27.5 16.2V15.8C27.5 14.1 26.2 12.8 24.5 12.8H17.4V8.8C17.4 7.2 15.6 6.5 14.5 7.5Z" fill="url(#kidBackGrad)" stroke="#D6336C" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="floating-canvas-btn floating-clear-btn" onclick="clearNameCanvas()" title="ลบวาดใหม่" aria-label="ลบวาดใหม่">🧽</button>
        <canvas id="nameCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- MOM'S SETTINGS MODAL -->
  <div class="settings-modal" id="settingsModal">
    <div class="settings-box">
      <div class="settings-title" data-i18n-th="⚙️ ตั้งค่าสำหรับคุณแม่ / คุณยาย" data-i18n-en="⚙️ Parent Settings">⚙️ ตั้งค่าสำหรับคุณแม่ / คุณยาย</div>

      <div class="setting-row">
        <div>
          <div class="setting-label" data-i18n-th="เลื่อนตัวอักษรถัดไปอัตโนมัติ" data-i18n-en="Auto-Advance to Next Letter">เลื่อนตัวอักษรถัดไปอัตโนมัติ</div>
          <div style="font-size: 0.8rem; color: #718096;" data-i18n-th="(Auto-Advance to next letter)" data-i18n-en="Moves forward after tracing">Moves forward after tracing</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="autoAdvanceToggle" onchange="toggleAutoAdvance(this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <div style="font-size: 0.85rem; color: #718096; line-height: 1.4;" data-i18n-html-th="* ค่าเริ่มต้น: อยู่ที่เดิมเพื่อให้ฝึกเขียนซ้ำ (Repeat mode)<br>* เปิดสวิตช์: เลื่อนไปตัวถัดไปเมื่อเขียนเสร็จ" data-i18n-html-en="* Default OFF: stays on the same letter to repeat.<br>* Turn ON: moves to next letter automatically.">
        * ค่าเริ่มต้น: อยู่ที่เดิมเพื่อให้ฝึกเขียนซ้ำ (Repeat mode)<br>
        * เปิดสวิตช์: เลื่อนไปตัวถัดไปเมื่อเขียนเสร็จ
      </div>

      <button class="close-settings-btn" onclick="closeSettingsModal()" data-i18n-th="เรียบร้อย (Close)" data-i18n-en="Done (Close)">เรียบร้อย (Close)</button>
    </div>
  </div>

  <script>
    window.ALPHABET_CONFIG = {
      enableNameStudio: true,
      cacheName: "glw-leda-v13",
      starsStorageKey: "boo_boo_stars_alpha",
      kids: {
        jayda: {
          name: "เจด้า",
          avatar: "./img/jayda.jpg",
          greetClip: "greet_jayda.m4a",
          greetText: "สวัสดีค่ะน้องเจด้าคนเก่ง มาวาดชื่อกันเลยค่ะ",
          praiseClip: "praise_jayda.m4a",
          praiseText: "เก่งมากค่ะน้องเจด้า",
          nameClip: "name_jayda.m4a"
        },
        dada: {
          name: "ดาด้า",
          avatar: "./img/dada.jpg",
          greetClip: "greet_dada.m4a",
          greetText: "สวัสดีค่ะน้องดาด้าคนเก่ง มาวาดชื่อกันเลยค่ะ",
          praiseClip: "praise_dada.m4a",
          praiseText: "เก่งมากค่ะน้องดาด้า",
          nameClip: "name_dada.m4a"
        }
      }
    };
  </script>
  <script src="./alphabet_core.js"></script>
  <script src="./ui_lang.js"></script>
</body>
</html>
